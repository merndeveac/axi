services:
  postgres:
    image: postgres:17-alpine
    profiles: ["infra"]
    environment:
      POSTGRES_DB: axi
      POSTGRES_USER: axi
      POSTGRES_PASSWORD: axi_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    profiles: ["infra"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
